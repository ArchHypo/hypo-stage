# HypoStage CI: runs the same validation as documented in the README
# (install → make check). make check runs build → test → lint with staged output
# and a final summary (timing, test/lint metrics). Requires Node.js 22.x (package.json engines).
#
# Validates:
#   - Dependencies install with frozen lockfile
#   - TypeScript compiles (build:types) and Backstage CLI build for the frontend, backend, and agents module
#   - All unit tests pass (frontend, backend, and agents module)
#   - Lint passes for every workspace
#   - PostgreSQL migrations and demo seeds for the plugin and the agents module,
#     including the fixture suggestion (the same check as `yarn seed`)

name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Install, build, lint & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backstage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backstage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --ignore-engines --frozen-lockfile

      - name: Build, test & lint
        run: make check
        # Frontend, backend, and agents module: typecheck, package build, unit tests, lint.

      # Unit tests use SQLite and skip the demo seed (NODE_ENV=test). This step
      # applies both packages' migrations and seeds to the workflow Postgres and
      # fails unless the agents fixture suggestion is present.
      - name: Migrate, seed, and verify the agents fixture
        run: |
          cp app-config.example.yaml app-config.yaml
          cd hypo-stage-backend && yarn seed
