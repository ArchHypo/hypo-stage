# Production config for HypoStage backend (Render/Railway).
# Uses env vars for secrets; safe to commit. Set BACKSTAGE_CONFIG_PATH to this file on Render.
# Render: set BACKSTAGE_CONFIG_PATH=../app-config.production.yaml (start runs from hypo-stage-backend).
# Render sets RENDER_EXTERNAL_URL automatically; on Railway set it to your service URL.

app:
  baseUrl: ${RENDER_EXTERNAL_URL}

backend:
  baseUrl: ${RENDER_EXTERNAL_URL}
  listen:
    port: 7007
  cors:
    # Backstage matches this with minimatch. The * covers production
    # (hypo-stage-hypo-stage.vercel.app) and preview hosts
    # (hypo-stage-hypo-stage-git-<id>-arch-hypo-projects.vercel.app).
    origin: https://hypo-stage-hypo-stage*.vercel.app
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE, OPTIONS]
    allowedHeaders: [Content-Type, Authorization, X-Requested-With, Accept]
  database:
    client: pg
    connection:
      host: ${PGHOST}
      port: ${PGPORT}
      user: ${PGUSER}
      password: ${PGPASSWORD}
      database: ${PGDATABASE}
    plugin:
      hypo-stage:
        connection:
          database: backstage_plugin_hypo_stage

# Agents stay off on the public Render demo. Do not add provider API keys here.
# The demo database still has a fixture suggestion so the Agent Suggestions card
# can be reviewed without calling a model. To enable a provider, see
# docs/agents/user-guide.md.
