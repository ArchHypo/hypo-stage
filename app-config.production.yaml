# Production config for HypoStage backend (Render/Railway).
# Uses env vars for secrets; safe to commit. Set BACKSTAGE_CONFIG_PATH to this file on Render.
# Render: set BACKSTAGE_CONFIG_PATH=../app-config.production.yaml (start runs from hypo-stage-backend).
# Render sets RENDER_EXTERNAL_URL automatically; on Railway set it to your service URL.

app:
  baseUrl: ${RENDER_EXTERNAL_URL}

backend:
  baseUrl: ${RENDER_EXTERNAL_URL}
  listen:
    port: 7007
  cors:
    # Frontend origin(s) allowed to call the API; add preview URLs here if needed (comma-separated or list per Backstage docs).
    origin: https://hypo-stage-hypo-stage.vercel.app
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE, OPTIONS]
    allowedHeaders: [Content-Type, Authorization, X-Requested-With, Accept]
  database:
    client: pg
    connection:
      host: ${PGHOST}
      port: ${PGPORT}
      user: ${PGUSER}
      password: ${PGPASSWORD}
      database: ${PGDATABASE}
    plugin:
      hypo-stage:
        connection:
          database: backstage_plugin_hypo_stage

hypoStage:
  github:
    apiToken: ${GITHUB_API_TOKEN}
    webhookSecret: ${GITHUB_WEBHOOK_SECRET}
  agents:
    enabled: ${AGENTS_ENABLED}
    defaultModel: default
    providers:
      anthropic:
        apiKey: ${AGENTS_ANTHROPIC_API_KEY}
      openai:
        apiKey: ${AGENTS_OPENAI_API_KEY}
      google:
        apiKey: ${AGENTS_GOOGLE_API_KEY}
      ollama:
        baseUrl: ${AGENTS_OLLAMA_BASE_URL}
    models:
      # AGENTS_MODEL_PROVIDER: anthropic | openai | google | ollama
      - key: default
        provider: ${AGENTS_MODEL_PROVIDER}
        modelId: ${AGENTS_MODEL_ID}
    # Add one entry per repository whose pull requests should be analyzed
    repositories:
      - repository: ${AGENTS_GITHUB_REPOSITORY}
